name: Phase17 Admin PR16 Independent Recovery Bundle
on:
  push:
    branches:
      - recovery/phase17-admin16-offsite-backup-20261024
permissions:
  contents: read
jobs:
  verify-backup-and-restoration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone full histories, assert refs, verify bundles and restore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundles scratch
          git clone --mirror https://github.com/shihab-tech04/Sobaike-Janao-Admin.git scratch/admin.git
          git clone --mirror https://github.com/shihab-tech04/Sobaike-janao-public.git scratch/public.git
          test "$(git --git-dir=scratch/admin.git rev-parse refs/heads/main)" = "45516d45a219604bca16567c51b87ea6eaa97e61"
          test "$(git --git-dir=scratch/admin.git rev-parse refs/heads/acceptance/phase17-a02-dashboard-triage-20261024)" = "1d85e2eee8e711fb77469325564ea828ea30317c"
          test "$(git --git-dir=scratch/public.git rev-parse refs/heads/main)" = "ffc8a86e2c6b744626f28f826b23b8469da8717c"
          git --git-dir=scratch/admin.git bundle create "$PWD/bundles/admin-complete.bundle" --all
          git --git-dir=scratch/public.git bundle create "$PWD/bundles/public-complete.bundle" --all
          git --git-dir=scratch/admin.git bundle verify "$PWD/bundles/admin-complete.bundle"
          git --git-dir=scratch/public.git bundle verify "$PWD/bundles/public-complete.bundle"
          git clone --mirror bundles/admin-complete.bundle scratch/restored-admin.git
          git clone --mirror bundles/public-complete.bundle scratch/restored-public.git
          git --git-dir=scratch/restored-admin.git fsck --full --no-reflogs
          git --git-dir=scratch/restored-public.git fsck --full --no-reflogs
          test "$(git --git-dir=scratch/restored-admin.git rev-parse refs/heads/main)" = "45516d45a219604bca16567c51b87ea6eaa97e61"
          test "$(git --git-dir=scratch/restored-admin.git rev-parse refs/heads/acceptance/phase17-a02-dashboard-triage-20261024)" = "1d85e2eee8e711fb77469325564ea828ea30317c"
          test "$(git --git-dir=scratch/restored-public.git rev-parse refs/heads/main)" = "ffc8a86e2c6b744626f28f826b23b8469da8717c"
          printf '%s\n' "Admin main=45516d45a219604bca16567c51b87ea6eaa97e61" "Admin PR16=1d85e2eee8e711fb77469325564ea828ea30317c" "Public main=ffc8a86e2c6b744626f28f826b23b8469da8717c" > bundles/EXACT_REFS.txt
          (cd bundles && sha256sum admin-complete.bundle public-complete.bundle EXACT_REFS.txt > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Package and checksum offline recovery artifact
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          out = Path("Sobaike_Phase17_Admin_PR16_Complete_Histories.zip")
          names = ['admin-complete.bundle','public-complete.bundle','EXACT_REFS.txt','SHA256SUMS.txt']
          with ZipFile(out, 'w', compression=ZIP_DEFLATED, compresslevel=6) as z:
              for name in names:
                  z.write(Path('bundles') / name, arcname=name)
          with ZipFile(out, 'r') as z:
              assert z.namelist() == names and z.testzip() is None
          PY
          sha256sum Sobaike_Phase17_Admin_PR16_Complete_Histories.zip
          echo PHASE17_ADMIN_PR16_FULL_HISTORY_RESTORE_AND_CHECKSUM_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: phase17-admin-pr16-dual-history
          path: Sobaike_Phase17_Admin_PR16_Complete_Histories.zip
          retention-days: 14
          if-no-files-found: error
