project_id = "sobaike-admin-recovery-test-only"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

# The isolated recovery suite creates users directly for Auth/MFA checks.
# No email-inbox assertions require Inbucket, and disabling it avoids the
# default 54324 binding colliding with other GitHub runner services.
[inbucket]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
enable_signup = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
