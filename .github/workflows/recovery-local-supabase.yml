name: Recovery local Supabase verification

on:
  push:
    branches:
      - recovery/2026-10-15-admin-modules

permissions:
  contents: read

jobs:
  runner-smoke:
    name: Free ubuntu-latest local Supabase runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Verify Docker and Supabase CLI
        run: |
          set -euo pipefail
          docker info --format 'Docker server: {{.ServerVersion}}'
          supabase --version

      - name: Start a blank disposable local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/sobaike-runtime-smoke"
          mkdir -p "$smoke_dir"
          cd "$smoke_dir"
          supabase init --yes > "$RUNNER_TEMP/sobaike-supabase-init.log" 2>&1
          if ! supabase start > "$RUNNER_TEMP/sobaike-supabase-start.log" 2>&1; then
            echo "::error title=Local Supabase runtime smoke failed::The blank disposable local stack did not start. CLI output is withheld to avoid printing generated local credentials."
            exit 1
          fi
          if ! supabase status >/dev/null 2>&1; then
            echo "::error title=Local Supabase runtime smoke failed::The blank disposable stack did not reach ready status."
            exit 1
          fi
          echo "## Runner runtime smoke: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "ubuntu-latest Docker and Supabase CLI started a blank local project. It used no project link, secrets, production endpoint, migrations, or records." >> "$GITHUB_STEP_SUMMARY"

      - name: Stop the disposable local stack
        if: always()
        shell: bash
        run: |
          if [[ -d "$RUNNER_TEMP/sobaike-runtime-smoke" ]]; then
            cd "$RUNNER_TEMP/sobaike-runtime-smoke"
            supabase stop >/dev/null 2>&1 || true
          fi

  app-readiness:
    name: Application stack reconstruction preflight
    runs-on: ubuntu-latest
    outputs:
      stack_ready: ${{ steps.preflight.outputs.stack_ready }}
    steps:
      - uses: actions/checkout@v4

      - name: Check recovered local backend files
        id: preflight
        run: python3 scripts/recovery_supabase_preflight.py admin

  local-app-integration:
    name: Admin isolated workflow integration
    needs: [runner-smoke, app-readiness]
    if: needs.app-readiness.outputs.stack_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Start only the unlinked local project
        run: supabase start

      - name: Export temporary loopback credentials for tests
        shell: bash
        run: |
          set -euo pipefail
          supabase status --output env > "$RUNNER_TEMP/sobaike-local-supabase.env"
          python3 - "$RUNNER_TEMP/sobaike-local-supabase.env" "$GITHUB_ENV" <<'PY'
          import sys
          from urllib.parse import urlparse

          values = {}
          for line in open(sys.argv[1], encoding="utf-8"):
              if "=" in line:
                  name, value = line.rstrip("\n").split("=", 1)
                  values[name] = value.strip().strip('"')
          url = values.get("API_URL") or values.get("SUPABASE_URL")
          key = values.get("ANON_KEY") or values.get("PUBLISHABLE_KEY") or values.get("SUPABASE_ANON_KEY")
          if not url or urlparse(url).hostname not in {"127.0.0.1", "localhost"} or not key:
              raise SystemExit("Local Supabase status did not return a loopback URL and local public key.")
          with open(sys.argv[2], "a", encoding="utf-8") as env:
              env.write(f"SUPABASE_URL={url}\nSUPABASE_ANON_KEY={key}\n")
              env.write(f"VITE_SUPABASE_URL={url}\nVITE_SUPABASE_PUBLISHABLE_KEY={key}\n")
          PY

      - name: Apply local migrations and synthetic seed
        run: supabase db reset --local

      - name: Run local database security tests
        run: supabase test db

      - name: Run recovered Admin integration journeys
        run: npm ci && npm run test:recovery:integration

      - name: Stop local project
        if: always()
        run: supabase stop >/dev/null 2>&1 || true

  responsive-browser-smoke:
    name: Admin responsive EN/BN browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app and temporary browser runner
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Start Vite with loopback-only placeholder Supabase settings
        shell: bash
        run: |
          set -euo pipefail
          VITE_SUPABASE_URL=http://127.0.0.1:54321 \
          VITE_SUPABASE_PUBLISHABLE_KEY=local-browser-only-placeholder \
            npm run dev -- --host 127.0.0.1 --port 3001 --strictPort > "$RUNNER_TEMP/sobaike-admin-vite.log" 2>&1 &
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3001/login >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Vite did not become ready; only loopback settings were configured."
          exit 1

      - name: Check responsive English and Bengali layouts
        env:
          RECOVERY_BROWSER_APP: admin
          RECOVERY_BROWSER_BASE_URL: http://127.0.0.1:3001
        run: node tests/recovery-browser-smoke.mjs
