name: Admin Recovery Vite Security Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  security-fix:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'recovery/2026-10-21-admin-consolidation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/2026-10-21-admin-consolidation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install verified baseline
        run: npm ci
      - name: Refresh only Vite dev dependency and lockfile
        run: npm install --save-dev --save-exact vite@6.4.4 --package-lock-only --ignore-scripts
      - name: Verify change scope
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/changes.txt
          if grep -vE '^(package.json|package-lock.json)$' /tmp/changes.txt; then exit 1; fi
          grep -q '^package-lock.json$' /tmp/changes.txt
          node -e "const p=require('./package.json'); if(p.devDependencies.vite!=='6.4.4') process.exit(1)"
      - name: Security and functional validation
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm test
          npm run lint
          npm run build
      - name: Commit and push tested manifest changes on draft branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(security): pin patched Vite 6.4.4 and refresh Admin lockfile"
          git push origin HEAD:recovery/2026-10-21-admin-consolidation
