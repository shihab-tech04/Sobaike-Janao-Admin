name: Admin Recovery Vite Security Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  security-fix:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'recovery/2026-10-21-admin-consolidation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/2026-10-21-admin-consolidation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install verified baseline
        run: npm ci
      - name: Remove vulnerable unused-at-runtime legacy image minifier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          f=Path('vite.config.ts')
          s=f.read_text()
          old_import="import viteImagemin from 'vite-plugin-imagemin';\\n".replace('\\n','\n')
          if old_import not in s or '      viteImagemin({' not in s:
              raise SystemExit('Source layout changed; refusing scripted removal')
          s=s.replace(old_import,'')
          begin=s.index('      viteImagemin({')
          close=s.find('      }),',begin)
          if close<0: raise SystemExit('Plugin closure not found')
          s=s[:begin]+s[close+len('      }),')+1:]
          if 'viteImagemin' in s: raise SystemExit('Incomplete plugin removal')
          f.write_text(s)
          PY
          npm uninstall --save-dev --package-lock-only --ignore-scripts vite-plugin-imagemin
          npm install --save-dev --save-exact vite@6.4.4 --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
      - name: Enforce scoped config and manifest changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/changes.txt
          if grep -vE '^(package.json|package-lock.json|vite.config.ts)$' /tmp/changes.txt; then
            echo 'Unexpected source diff'; exit 1
          fi
          node -e "const p=require('./package.json'); if(p.devDependencies.vite!=='6.4.4'||p.devDependencies['vite-plugin-imagemin'])process.exit(1)"
      - name: Full dependency and source validation
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm test
          npm run lint
          npm run build
      - name: Commit and push tested manifest changes on draft branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json vite.config.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(security): remove vulnerable image-minifier chain and pin Vite 6.4.4"
          git push origin HEAD:recovery/2026-10-21-admin-consolidation
