name: Release v1.0.1 Tag

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.yml'

permissions:
  contents: write

jobs:
  verify-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Create v1.0.1 tag
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.1 >/dev/null 2>&1; then
            echo "v1.0.1 already exists; leaving it unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1.0.1 "$GITHUB_SHA" -m "Production release v1.0.1"
          git push origin v1.0.1
