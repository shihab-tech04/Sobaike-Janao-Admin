name: Phase17 Exact-Head Dual Repository Recovery Artifact

on:
  pull_request:
    paths:
      - .github/workflows/phase17-current-head-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-bundle-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Construct and independently verify protected-release Git history archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovery"/{sources,restore,export}
          cd "$RUNNER_TEMP/recovery"
          git clone --mirror https://github.com/shihab-tech04/Sobaike-Janao-Admin.git sources/admin.git
          git clone --mirror https://github.com/shihab-tech04/Sobaike-janao-public.git sources/public.git
          a="$(git --git-dir=sources/admin.git rev-parse refs/heads/main)"
          p="$(git --git-dir=sources/public.git rev-parse refs/heads/main)"
          test -n "$a" && test -n "$p" || { echo "Missing Git main head; FAIL CLOSED"; exit 1; }
          git --git-dir=sources/admin.git fsck --full --strict
          git --git-dir=sources/public.git fsck --full --strict
          git --git-dir=sources/admin.git bundle create "$PWD/export/admin-full-history.bundle" --all
          git --git-dir=sources/public.git bundle create "$PWD/export/public-full-history.bundle" --all
          git --git-dir=sources/admin.git bundle verify "$PWD/export/admin-full-history.bundle"
          git --git-dir=sources/public.git bundle verify "$PWD/export/public-full-history.bundle"
          git clone --mirror "$PWD/export/admin-full-history.bundle" restore/admin.git
          git clone --mirror "$PWD/export/public-full-history.bundle" restore/public.git
          test "$(git --git-dir=restore/admin.git rev-parse refs/heads/main)" = "$a"
          test "$(git --git-dir=restore/public.git rev-parse refs/heads/main)" = "$p"
          git --git-dir=restore/admin.git fsck --full --strict
          git --git-dir=restore/public.git fsck --full --strict
          a_remote="$(git ls-remote https://github.com/shihab-tech04/Sobaike-Janao-Admin.git refs/heads/main | cut -f1)"
          p_remote="$(git ls-remote https://github.com/shihab-tech04/Sobaike-janao-public.git refs/heads/main | cut -f1)"
          test "$a_remote" = "$a" || { echo "Admin advanced during backup; FAIL CLOSED"; exit 1; }
          test "$p_remote" = "$p" || { echo "Public advanced during backup; FAIL CLOSED"; exit 1; }
          printf 'Public main: %s\nAdmin main: %s\nRestore: git clone --mirror <bundle-file> <dest>; git --git-dir=<dest> fsck --full --strict\n' "$p" "$a" > export/RESTORE_MANIFEST.txt
          ( cd export && sha256sum admin-full-history.bundle public-full-history.bundle RESTORE_MANIFEST.txt > SHA256SUMS && sha256sum -c SHA256SUMS )
          tar -czf "$GITHUB_WORKSPACE/phase17-full-current-head-restore.tar.gz" -C export admin-full-history.bundle public-full-history.bundle RESTORE_MANIFEST.txt SHA256SUMS
          sha256sum "$GITHUB_WORKSPACE/phase17-full-current-head-restore.tar.gz"
      - name: Save exact-head full history for authenticated Drive transfer
        uses: actions/upload-artifact@v4
        with:
          name: phase17-full-current-head-restore
          path: phase17-full-current-head-restore.tar.gz
          retention-days: 15
          if-no-files-found: error
